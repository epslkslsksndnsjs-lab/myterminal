<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTerminal Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0d0d0d; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #161616; border: 1px solid #333; border-radius: 12px; padding: 3rem; max-width: 480px; text-align: center; }
  h1 { color: #00e676; font-size: 1.8rem; margin-bottom: 0.5rem; }
  p { color: #808080; line-height: 1.6; margin-bottom: 1.5rem; }
  .badge { display: inline-block; background: #1e1e1e; color: #00e676; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-family: monospace; }
  .time { color: #555; font-size: 0.8rem; margin-top: 1.5rem; font-family: monospace; }
</style>
</head>
<body>
  <div class="card">
    <h1>MyTerminal</h1>
    <p>由 MyTerminal Actions API 创建，零外部依赖，纯 HTML + 内联 CSS。</p>
    <span class="badge">feat/conversation-stream</span>
    <div class="time">created via write_file tool</div>
  </div>
</body>
</html>
