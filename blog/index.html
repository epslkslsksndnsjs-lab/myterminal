<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTerminal 博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚀 MyTerminal 博客</h1>
    <p>由 AI Agent 通过 AGENT.md 规则生成</p>
  </header>
  <main>
    <article>
      <h2>什么是 AGENT.md？</h2>
      <time>2026-07-24</time>
      <p>AGENT.md 是用户写入 ~/.config/myterminal/AGENT.md 的自定义指令文件。每次 ChatGPT 连接 MyTerminal 时，这些指令会自动注入，成为 AI 必须遵守的规则。</p>
    </article>
    <article>
      <h2>规则示例</h2>
      <ul>
        <li>✅ 命令前先提醒用户</li>
        <li>✅ 永远使用 pnpm</li>
        <li>✅ 修改文件前查 Git 状态</li>
        <li>✅ 完成后自动提交</li>
      </ul>
    </article>
  </main>
  <footer>
    <p>Powered by MyTerminal v0.1.1</p>
  </footer>
</body>
</html>
